<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pão do Ciso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --banner: #2e2610; --p-green: #2d3a27; --a-brown: #7d4f39; 
            --bg: #fdf5e6; --nav: #dccbb0; --text: #3e2723; --w: #fff; 
            --red: #b22222; --highlight: #f9f0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); font-family: 'Calibri', sans-serif; color: var(--text); }

        header { background: var(--banner); color: #fdf5e6; padding: 15px; border-bottom: 4px solid var(--a-brown); display: flex; align-items: center; justify-content: center; gap: 15px; flex-shrink: 0; }
        .logo-img { width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--a-brown); object-fit: cover; background: white; }
        header h1 { font-size: 1.4rem; text-transform: uppercase; }
        .sub-link { color: #fdf5e6; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; margin-top: 4px; }

        .main-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .container { max-width: 600px; margin: auto; }
        
        .collapsible { background: var(--nav); color: var(--text); cursor: pointer; padding: 12px; width: 100%; border: none; text-align: left; font-weight: bold; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; }
        .collapsible-content { display: none; }

        .card { background: var(--w); border-radius: 12px; padding: 15px; margin: 15px 0; border: 1px solid #eaddca; }
        .frame-quantidade { background: var(--highlight); border: 1px solid #eaddca; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        .frame-opcionais { border: 1px solid #eaddca; border-radius: 8px; padding: 12px; margin-bottom: 10px; }
        
        .linha-controle { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
        .qty-box { display: flex; align-items: center; border: 2px solid var(--p-green); border-radius: 6px; height: 34px; width: 105px; background: white; flex-shrink: 0; }
        .btn-q { background: var(--p-green); border: none; width: 34px; height: 100%; color: white; cursor: pointer; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }
        .qty-val { width: 37px; border: none; text-align: center; font-weight: bold; font-size: 1rem; }

        .subtotal-item { text-align: right; font-weight: bold; color: var(--p-green); margin: 10px 0; padding-top: 8px; border-top: 1px solid #eee; }
        .btn-add, .btn-prosseguir { background: var(--p-green); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }

        /* CESTA NO RODAPÉ */
        #cesta-rodape { background: var(--nav); border-top: 3px solid var(--a-brown); display: none; flex-direction: column; flex-shrink: 0; max-height: 250px; }
        .cesta-scroll { flex: 1; overflow-y: auto; padding: 10px; }
        .cesta-item-linha { background: white; padding: 10px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #c4b49c; }
        .barra-total { background: var(--red); color: white; padding: 10px 15px; display: flex; justify-content: space-between; font-weight: bold; }

        /* MODAIS */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 999; }
        .modal-pedido { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--w); border-radius: 12px; width: 90%; max-width: 480px; z-index: 1000; padding: 20px; max-height: 85vh; overflow-y: auto; }
        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; }
    </style>
</head>
<body>

<header>
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhQuJ4QfA-MRI3zoMZ369g2bR010Oo5zbObK9ESGcNWq2TMO197DYMjXXdICjeYi4l_8DwNCuPzpso6-M_6ED22uWkLtzU7sId9nj6KzfnvY2-oHXpKXypBYkCL4BU3P17UXbIvj_vDu1d57d5j82KSv7zv7mDdKJpncS18bn4KpKhcGjjwHEse2-CgWzQ/s320/logo2.png" class="logo-img">
    <div>
        <h1>Pão do Ciso</h1>
        <div class="subtitulos">
            <a href="https://wa.me/5511982391781" class="sub-link"><i class="fab fa-whatsapp"></i> +55 11 98239-1781</a>
        </div>
    </div>
</header>

<div class="main-scroll"><div class="container" id="render-cli"></div></div>

<div id="cesta-rodape">
    <div class="cesta-scroll" id="lista-rodape"></div>
    <div class="barra-total"><span>TOTAL:</span><span id="total-txt">R$ 0,00</span></div>
    <button class="btn-prosseguir" onclick="abrirRevisao()">PROSSEGUIR</button>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="fecharModais()"></div>
<div id="modalRevisao" class="modal-pedido">
    <h3 style="margin-bottom:15px">Revisão do Pedido</h3>
    <div id="revisao-conteudo"></div>
    <div style="font-weight:bold; margin-top:15px; text-align:right" id="revisao-total"></div>
    <div style="display:flex; gap:10px; margin-top:20px">
        <button class="btn-add" style="background:#888" onclick="fecharModais()">+ ITENS</button>
        <button class="btn-add" onclick="abrirDados()">PROSSEGUIR</button>
    </div>
</div>

<div id="modalDados" class="modal-pedido">
    <h3>Seus Dados</h3>
    <input type="text" id="nomeCli" placeholder="Nome">
    <input type="tel" id="telCli" placeholder="WhatsApp (11999999999)" maxlength="11">
    <select id="tipoEntrega" onchange="document.getElementById('end-box').style.display = this.value === 'Entrega' ? 'block' : 'none'">
        <option value="Retirada">Vou retirar</option>
        <option value="Entrega">Entrega em domicílio</option>
    </select>
    <div id="end-box" style="display:none"><input type="text" id="endCli" placeholder="Endereço completo"></div>
    <select id="pagamento">
        <option value="Pix">Pix (paodociso@gmail.com)</option>
        <option value="Cartão">Cartão</option>
        <option value="Dinheiro">Dinheiro</option>
    </select>
    <button class="btn-prosseguir" style="margin-top:15px" onclick="finalizar()">FINALIZAR PEDIDO</button>
</div>

<script src="cardapio.js"></script>
<script>
let carrinho = [], totalGeral = 0;

function render() {
    const { secoes, opcionaisGerais: opsG, opcionaisPanini: opsP } = dadosIniciais;
    document.getElementById('render-cli').innerHTML = secoes.map((s, si) => `
        <button class="collapsible" onclick="toggleC(this)">${s.nome.toUpperCase()} <span>+</span></button>
        <div class="collapsible-content">
            ${s.itens.map((i, ii) => {
                const id = `it-${si}-${ii}`;
                const iOps = (i[4] || []).map(n => (s.tipoOpcional === "panini" ? opsP : opsG).find(x => x[0].trim() === n.trim())).filter(Boolean);
                return `
                <div class="card" id="card-${id}">
                    <div style="display:flex; gap:10px; margin-bottom:10px">
                        <img src="${i[3]}" style="width:70px; height:70px; object-fit:cover; border-radius:8px">
                        <div><b>${i[0]}</b><br><small>R$ ${(+i[2]).toFixed(2)}</small></div>
                    </div>
                    <div class="frame-quantidade">
                        <div class="linha-controle">
                            <span>Quantidade do item</span>
                            <div class="qty-box"><button class="btn-q" onclick="mudar(-1,'${id}',${i[2]})">-</button><input type="text" value="0" readonly class="qty-val main-qty"><button class="btn-q" onclick="mudar(1,'${id}',${i[2]})">+</button></div>
                        </div>
                    </div>
                    ${iOps.length ? `<div class="frame-opcionais"><small>OPCIONAIS</small>${iOps.map(o => `
                        <div class="linha-controle">
                            <span>${o[0]} (+R$ ${(+o[1]).toFixed(2)})</span>
                            <div class="qty-box"><button class="btn-q" onclick="mudar(-1,'${id}',${i[2]})">-</button><input type="text" value="0" readonly class="qty-val op-qty" data-n="${o[0]}" data-p="${o[1]}"><button class="btn-q" onclick="mudar(1,'${id}',${i[2]})">+</button></div>
                        </div>`).join('')}</div>` : ''}
                    <div class="subtotal-item" id="sub-${id}">Subtotal: R$ 0,00</div>
                    <button class="btn-add" onclick="add('${i[0]}', ${i[2]}, '${id}')">ADICIONAR</button>
                </div>`}).join('')}
        </div>`).join('');
}

function toggleC(b) { const c = b.nextElementSibling; c.style.display = c.style.display === 'block' ? 'none' : 'block'; }

function mudar(d, id, base) {
    const box = event.target.parentNode;
    const inp = box.querySelector('input');
    inp.value = Math.max(0, +inp.value + d);
    
    const card = document.getElementById(`card-${id}`);
    const qP = +card.querySelector('.main-qty').value;
    
    let somaOpcionais = 0;
    card.querySelectorAll('.op-qty').forEach(o => somaOpcionais += (+o.value * +o.dataset.p));

    // REABILITADO: Soma tudo o que tiver índice (quantidade) maior que 0
    // Se tiver produto principal, ele multiplica o preço base + opcionais.
    // Se NÃO tiver produto principal, ele soma apenas os opcionais.
    let totalCard = qP > 0 ? qP * (base + somaOpcionais) : somaOpcionais;
    
    document.getElementById(`sub-${id}`).innerText = `Subtotal: R$ ${totalCard.toFixed(2)}`;
}

function add(nome, preco, id) {
    const card = document.getElementById(`card-${id}`);
    const qP = +card.querySelector('.main-qty').value;
    let extras = [], pE = 0;
    card.querySelectorAll('.op-qty').forEach(o => { if(+o.value > 0){ extras.push({n: o.dataset.n, q: o.value}); pE += (+o.value * +o.dataset.p); }});
    
    if (qP <= 0 && pE <= 0) return alert("Selecione algo!");

    const sub = qP > 0 ? qP * (preco + pE) : pE;
    carrinho.push({ nome: qP > 0 ? `${qP}x ${nome}` : `Opcionais: ${nome}`, sub, extras });
    totalGeral += sub;
    
    atualizarCesta();
    // Reset card
    card.querySelector('.main-qty').value = 0;
    card.querySelectorAll('.op-qty').forEach(o => o.value = 0);
    document.getElementById(`sub-${id}`).innerText = "Subtotal: R$ 0,00";
}

function atualizarCesta() {
    document.getElementById('cesta-rodape').style.display = carrinho.length ? 'flex' : 'none';
    document.getElementById('total-txt').innerText = `R$ ${totalGeral.toFixed(2)}`;
    document.getElementById('lista-rodape').innerHTML = carrinho.map((i, idx) => `
        <div class="cesta-item-linha">
            <div><b>${i.nome}</b><br><small>R$ ${i.sub.toFixed(2)}</small></div>
            <button style="color:red; border:none; background:none; cursor:pointer" onclick="remover(${idx})">REMOVER</button>
        </div>`).join('');
}

function remover(idx) {
    totalGeral -= carrinho[idx].sub;
    carrinho.splice(idx, 1);
    atualizarCesta();
    if(document.getElementById('modalRevisao').style.display === 'block') abrirRevisao();
}

function abrirRevisao() {
    document.getElementById('modalOverlay').style.display = 'block';
    document.getElementById('modalRevisao').style.display = 'block';
    document.getElementById('revisao-total').innerText = `TOTAL: R$ ${totalGeral.toFixed(2)}`;
    document.getElementById('revisao-conteudo').innerHTML = carrinho.map((i, idx) => `
        <div style="border-bottom:1px solid #eee; padding:10px 0">
            <div style="display:flex; justify-content:space-between"><b>${i.nome}</b><button onclick="remover(${idx})" style="color:red; border:none; background:none; cursor:pointer">Remover</button></div>
            ${i.extras.map(e => `<div style="font-size:0.8rem; color:#666">└ ${e.q}x ${e.n}</div>`).join('')}
            <div style="text-align:right">R$ ${i.sub.toFixed(2)}</div>
        </div>`).join('');
}

function abrirDados() { document.getElementById('modalRevisao').style.display = 'none'; document.getElementById('modalDados').style.display = 'block'; }
function fecharModais() { document.getElementById('modalOverlay').style.display = 'none'; document.querySelectorAll('.modal-pedido').forEach(m => m.style.display = 'none'); }

async function finalizar() {
    const nome = document.getElementById('nomeCli').value;
    const tel = document.getElementById('telCli').value;
    const entrega = document.getElementById('tipoEntrega').value;
    const endereco = entrega === 'Entrega' ? document.getElementById('endCli').value : 'Retirada';
    
    if(!nome || tel.length < 10) return alert("Dados incompletos!");

    const itensPlanilha = carrinho.map(i => `${i.nome} (${i.extras.map(e => e.q+'x '+e.n).join(', ')})`).join(' | ');

    // 1. SPREADSHEET (Substitua a URL abaixo pela sua URL do Apps Script)
    const dados = {
        Data: new Date().toLocaleString('pt-BR'),
        Nome: nome,
        Telefone: tel,
        Tipo: entrega,
        Endereco: endereco,
        Itens: itensPlanilha,
        Total: totalGeral.toFixed(2)
    };

    fetch('SUA_URL_DO_GOOGLE_APPS_SCRIPT_AQUI', {
        method: 'POST',
        mode: 'no-cors',
        body: JSON.stringify(dados)
    });

    // 2. WHATSAPP
    let msg = `*NOVO PEDIDO - PÃO DO CISO*\n\nCliente: ${nome}\nEntrega: ${entrega}\nTotal: R$ ${totalGeral.toFixed(2)}`;
    window.open(`https://wa.me/5511982391781?text=${encodeURIComponent(msg)}`);
}

window.onload = render;
</script>
</body>
</html>
