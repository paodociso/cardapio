<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pão do Ciso</title>
    <style>
        :root { --p-green: #2d3a27; --a-brown: #7d4f39; --bg: #fdf5e6; --nav: #dccbb0; --text: #3e2723; --w: #fff; }
        * { box-sizing: border-box; }
        
        html, body { 
            height: 100%; 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            background: var(--bg); 
            font-family: 'Calibri', 'Segoe UI', 'Arial', sans-serif; 
        }
        
        /* BANNER COM LOGO, TÍTULO E INSTA */
        header { 
            background: var(--p-green); 
            color: #fdf5e6; 
            padding: 20px 15px; 
            text-align: center; 
            border-bottom: 4px solid var(--a-brown); 
            flex-shrink: 0; 
        }
        .logo-placeholder {
            width: 80px;
            height: 80px;
            background: rgba(255,255,255,0.1);
            border: 2px dashed rgba(255,255,255,0.3);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .logo-placeholder img { width: 100%; height: 100%; object-fit: cover; }
        
        header h1 { margin: 0; font-size: 1.6rem; letter-spacing: 2px; text-transform: uppercase; }
        header p { margin: 5px 0; font-style: italic; font-size: 0.95rem; opacity: 0.9; }
        
        .insta-link { 
            display: inline-flex; 
            align-items: center; 
            gap: 5px; 
            color: #fdf5e6; 
            text-decoration: none; 
            margin-top: 8px; 
            font-size: 0.85rem;
            background: rgba(0,0,0,0.2);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* ÁREA DO CARDÁPIO */
        .main-scroll { flex-grow: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .container { max-width: 600px; margin: auto; }

        .collapsible { background: var(--nav); color: var(--text); cursor: pointer; padding: 12px; width: 100%; border: none; text-align: left; font-size: 1rem; font-weight: bold; border-radius: 8px; margin-top: 15px; display: flex; justify-content: space-between; font-family: inherit; }
        .collapsible-content { display: none; }

        .card { background: var(--w); border-radius: 12px; padding: 15px; margin: 15px 0; border: 1px solid #eaddca; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .prod-header { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
        .img-thumb { width: 65px; height: 65px; object-fit: cover; border-radius: 8px; }
        
        .prod-info b { font-size: 1.1rem; color: var(--p-green); }
        .prod-info small { font-weight: bold; color: var(--a-brown); font-size: 1rem; }

        .qty-box { display: flex; align-items: center; border: 2px solid var(--p-green); border-radius: 8px; height: 35px; background: white; overflow: hidden; }
        .btn-q { background: var(--p-green); border: none; width: 35px; height: 100%; color: white; font-weight: bold; cursor: pointer; font-size: 1.2rem; font-family: inherit; }
        .qty-val { width: 40px; border: none; text-align: center; font-weight: bold; background: transparent; font-family: inherit; font-size: 1rem; }

        /* RODAPÉ DINÂMICO */
        .footer-cart { background: white; border-top: 4px solid var(--p-green); padding: 15px; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.1); flex-shrink: 0; }
        
        #cesta-itens { max-height: 0; overflow-y: auto; transition: max-height 0.3s ease; background: #fffcf5; margin: 0; }
        #cesta-itens.open { max-height: 40vh; padding: 10px 0; border-bottom: 1px solid #eee; margin-bottom: 10px; }

        .item-cesta { border-bottom: 1px solid #eee; padding: 10px 0; }
        .opcional-linha { display: block; font-size: 0.85rem; color: #555; padding-left: 10px; border-left: 2px solid var(--nav); margin-top: 3px; }
        
        .btn-add { background: var(--p-green); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; font-family: inherit; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .modal-content { background: var(--bg); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; font-family: inherit; }
        .modal-content input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ccc; font-family: inherit; }
    </style>
</head>
<body>

<header>
    <div class="logo-placeholder">
        <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjkhyphenhyphenADG_zMDc0sgRUbpezC3xd2CoUxZqTv1N8NwqMqQXdkjtyMnZjTl5n7hgvIDy3vdM85eKjtmDZ9c2pZ4pAHIoKzLwIRCegDOdCFy3tL2Bv4fT2O58oG7JoSlAgaREkhmrizikrxpU3SpqsoyiTy00ZCqcuBpSANH8DKwYPuxOHHUSHciBlO64Yj2_lk/s320/logo2.png" alt="Logo Pão do Ciso">
    </div>
    <h1>Pão do Ciso</h1>
    <p>Nanopadaria artesanal</p>
    <a href="https://www.instagram.com/paodociso" target="_blank" class="insta-link">
        <svg width="16" height="16" fill="currentColor" viewBox="0 0 16 16">

        </svg>
        @paodociso
    </a>
</header>

<div class="main-scroll">
    <div class="container" id="render-cli"></div>
</div>

<div class="footer-cart" id="main-footer">
    <div id="cesta-itens"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; max-width:570px; margin:auto;">
        <div onclick="toggleCesta()" style="cursor:pointer">
            <span style="text-decoration:underline; font-size:0.9rem; font-weight:bold; color:var(--a-brown)">🛒 Ver Cesta (<span id="cart-count">0</span>)</span><br>
            <b style="font-size:1.1rem">Total: R$ <span id="total-geral">0.00</span></b>
        </div>
        <button class="btn-add" style="background:var(--a-brown)" onclick="abrirModal()">Finalizar Pedido</button>
    </div>
</div>

<div id="modal-dados" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:var(--p-green)">Finalizar Pedido</h3>
        <input type="text" id="f-nome" placeholder="Escreva seu Nome">
        <div style="display:flex; gap:10px;">
            <button onclick="fecharModal()" style="flex:1; padding:12px; border-radius:8px; border:1px solid #ccc; background:#fff; cursor:pointer;">Voltar</button>
            <button onclick="enviarWhats()" style="flex:2; padding:12px; background:var(--p-green); color:white; border:none; font-weight:bold; border-radius:8px; cursor:pointer;">Enviar no WhatsApp</button>
        </div>
    </div>
</div>

<script src="cardapio.js"></script>
<script>
    let carrinho = [];

    const rd = (db) => {
        const opsFull = db.opcionais.map(o => ({ n: o[0], p: parseFloat(o[1]) }));
        const html = db.secoes.map((s, si) => `
            <button class="collapsible" onclick="this.classList.toggle('active'); var c=this.nextElementSibling; c.style.display=(c.style.display==='block'?'none':'block')">${s.nome.toUpperCase()}</button>
            <div class="collapsible-content">
                ${s.itens.map((i, ii) => {
                    const id = `it-${si}-${ii}`;
                    const itemOps = (i[3] || []).map(n => opsFull.find(x => x.n === n)).filter(x=>x);
                    return `
                    <div class="card" id="card-${id}">
                        <div class="prod-header">
                            <img src="${i[2]}" class="img-thumb">
                            <div class="prod-info">
                                <b>${i[0]}</b><br>
                                <span style="font-size:0.85rem; color:#666">${i[4] || ''}</span><br>
                                <small>R$ ${parseFloat(i[1]).toFixed(2)}</small>
                            </div>
                        </div>
                        ${itemOps.map(o => `
                            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-top:1px solid #eee;">
                                <span style="font-size:0.85rem">${o.n} (+${o.p.toFixed(2)})</span>
                                <div class="qty-box">
                                    <button class="btn-q" onclick="mudar('${id}',${i[1]},-1,false,this)">-</button>
                                    <input type="text" value="0" readonly class="qty-val qty-opc" data-p="${o.p}" data-n="${o.n}">
                                    <button class="btn-q" onclick="mudar('${id}',${i[1]},1,false,this)">+</button>
                                </div>
                            </div>`).join('')}
                        <div style="display:flex; justify-content:space-between; margin-top:10px; align-items:center;">
                            <div class="qty-box">
                                <button class="btn-q" onclick="mudar('${id}',${i[1]},-1,true,this)">-</button>
                                <input type="text" value="1" readonly class="qty-val qty-pao">
                                <button class="btn-q" onclick="mudar('${id}',${i[1]},1,true,this)">+</button>
                            </div>
                            <button class="btn-add" onclick="add('${id}','${i[0]}')">Adicionar R$ <span class="local-total">${parseFloat(i[1]).toFixed(2)}</span></button>
                        </div>
                    </div>`;
                }).join('')}
            </div>`).join('');
        document.getElementById('render-cli').innerHTML = html;
    };

    function mudar(id, base, d, isP, btn) {
        let inp = btn.parentNode.querySelector('input');
        let v = parseInt(inp.value) + d;
        if(isP) { if(v<1) v=1; } else { if(v<0) v=0; }
        inp.value = v;
        const c = document.getElementById('card-'+id);
        const qP = parseInt(c.querySelector('.qty-pao').value);
        let sO = 0; c.querySelectorAll('.qty-opc').forEach(o => sO += (parseInt(o.value)*parseFloat(o.dataset.p)));
        c.querySelector('.local-total').innerText = ((base + sO) * qP).toFixed(2);
    }

    function add(id, nome) {
        const c = document.getElementById('card-'+id);
        const qtd = parseInt(c.querySelector('.qty-pao').value);
        const total = parseFloat(c.querySelector('.local-total').innerText);
        let selecionados = [];
        c.querySelectorAll('.qty-opc').forEach(o => {
            if(parseInt(o.value) > 0) selecionados.push(`${o.value}x ${o.dataset.n}`);
        });
        carrinho.push({ id, nome, qtd, total, selecionados, cid: Date.now() });
        document.getElementById('cesta-itens').classList.add('open');
        updateCart();
    }

    function updateCart() {
        document.getElementById('total-geral').innerText = carrinho.reduce((a,b) => a + b.total, 0).toFixed(2);
        document.getElementById('cart-count').innerText = carrinho.length;
        document.getElementById('cesta-itens').innerHTML = carrinho.map(x => `
            <div class="item-cesta">
                <b>${x.qtd}x ${x.nome}</b>
                ${x.selecionados.map(s => `<span class="opcional-linha">+ ${s}</span>`).join('')}
                <div style="display:flex; justify-content:space-between; margin-top:8px;">
                    <span style="font-weight:bold">R$ ${x.total.toFixed(2)}</span>
                    <div>
                        <button onclick="editar('${x.cid}')" style="background:#f0ad4e; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer;">Editar</button>
                        <button onclick="remover('${x.cid}')" style="background:#d9534f; color:white; border:none; padding:5px 10px; border-radius:4px; font-size:0.75rem; cursor:pointer;">Remover</button>
                    </div>
                </div>
            </div>`).join('');
        const cesta = document.getElementById('cesta-itens');
        cesta.scrollTop = cesta.scrollHeight;
    }

    function remover(cid) { 
        carrinho = carrinho.filter(x => x.cid !== cid); 
        if(carrinho.length === 0) document.getElementById('cesta-itens').classList.remove('open');
        updateCart(); 
    }

    function editar(cid) {
        const item = carrinho.find(x => x.cid === cid);
        remover(cid);
        document.getElementById('card-'+item.id).scrollIntoView({behavior: "smooth", block: "center"});
        document.getElementById('cesta-itens').classList.remove('open');
    }

    function toggleCesta() { if(carrinho.length > 0) document.getElementById('cesta-itens').classList.toggle('open'); }
    function abrirModal() { if(carrinho.length === 0) return alert("Cesta vazia!"); document.getElementById('modal-dados').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modal-dados').style.display = 'none'; }

    function enviarWhats() {
        const nomeCli = document.getElementById('f-nome').value;
        if(!nomeCli) return alert("Informe seu nome.");
        const agora = new Date();
        let msg = `*PEDIDO PÃO DO CISO*%0A*Data:* ${agora.toLocaleDateString()} às ${agora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}%0A*Cliente:* ${nomeCli}%0A%0A`;
        carrinho.forEach(i => {
            msg += `✅ *${i.qtd}x ${i.nome}*%0A`;
            i.selecionados.forEach(s => msg += `  └ ${s}%0A`);
            msg += `Subtotal: R$ ${i.total.toFixed(2)}%0A---%0A`;
        });
        msg += `%0A*TOTAL: R$ ${document.getElementById('total-geral').innerText}*`;
        window.open(`https://wa.me/5511982391781?text=${msg}`);
    }

    window.onload = () => rd(dadosIniciais);
</script>
</body>
</html>
