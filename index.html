<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pão do Ciso</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --p-green: #2d3a27; --a-brown: #7d4f39; --bg: #fdf5e6; --nav: #dccbb0; --text: #3e2723; --w: #fff; --red: #b22222; }
        * { box-sizing: border-box; }
        html, body { height: 100%; margin: 0; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); font-family: 'Calibri', sans-serif; }

        header { background: var(--p-green); color: #fdf5e6; padding: 15px; border-bottom: 4px solid var(--a-brown); flex-shrink: 0; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .logo-img { width: 85px; height: 85px; border-radius: 50%; border: 3px solid var(--a-brown); object-fit: cover; background: white; }
        header h1 { margin: 0; font-size: 1.4rem; text-transform: uppercase; line-height: 1.1; }
        header p { margin: 4px 0; font-size: 1.1rem; font-style: italic; }
        .contact-links { display: flex; flex-direction: column; gap: 4px; }
        .contact-link { color: #fdf5e6; text-decoration: none; font-size: 0.9rem; display: flex; align-items: center; gap: 6px; }

        .main-scroll { flex: 1; overflow-y: auto; padding: 15px; }
        .container { max-width: 600px; margin: auto; }

        .collapsible { background: var(--nav); color: var(--text); cursor: pointer; padding: 12px; width: 100%; border: none; text-align: left; font-weight: bold; border-radius: 8px; margin-top: 15px; display: flex; justify-content: space-between; }
        .collapsible-content { display: none; }
        .card { background: var(--w); border-radius: 12px; padding: 15px; margin: 15px 0; border: 1px solid #eaddca; }
        .prod-header { display: flex; gap: 15px; margin-bottom: 10px; }
        .img-thumb { width: 75px; height: 75px; object-fit: cover; border-radius: 10px; }
        .prod-info b { font-size: 1.1rem; color: var(--p-green); display: block; }
        .prod-info small { font-weight: bold; color: var(--a-brown); }

        .segment-qty { background: #f9f0e0; padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eaddca; }
        .segment-optional { background: #fff; border: 1px solid #eee; padding: 12px; border-radius: 8px; }
        .optional-title { display: block; font-size: 0.75rem; font-weight: bold; color: var(--a-brown); text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid #f0f0f0; padding-bottom: 5px; }

        .qty-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; gap: 15px; }
        .qty-row span { flex: 1; text-align: left; font-size: 0.9rem; line-height: 1.2; }
        .qty-box { display: flex; align-items: center; border: 2px solid var(--p-green); border-radius: 8px; overflow: hidden; height: 32px; width: 105px; flex-shrink: 0; background: white; }
        
        .btn-q { background: var(--p-green); border: none; width: 34px; height: 100%; color: white; cursor: pointer; font-weight: bold; font-size: 1.1rem; display: flex; align-items: center; justify-content: center; }
        .qty-val { width: 37px; border: none; text-align: center; font-weight: bold; font-size: 0.95rem; color: var(--text); }
        
        .card-footer { margin-top: 15px; padding-top: 10px; border-top: 2px solid #f0f0f0; display: flex; flex-direction: column; gap: 10px; }
        .subtotal-item { text-align: right; font-weight: bold; color: var(--p-green); font-size: 1rem; }
        .btn-add { background: var(--p-green); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }

        #cesta-rodape { background: var(--nav); border-top: 3px solid var(--a-brown); display: none; flex-direction: column; flex-shrink: 0; }
        .cesta-lista { max-height: 150px; overflow-y: auto; padding: 10px 15px; }
        
        .item-cesta { background: var(--w); padding: 10px; border-radius: 6px; margin-bottom: 5px; font-size: 0.9rem; border: 1px solid #ccc; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .item-info { flex: 1; }
        .btn-remove { background: var(--red); color: white; border: none; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; flex-shrink: 0; }
        
        .barra-total { background: var(--red); color: white; padding: 10px 15px; display: flex; justify-content: space-between; font-weight: bold; font-size: 1.1rem; }

        #form-dados { display: none; padding: 15px; background: #f9f0e0; flex-direction: column; gap: 10px; border-top: 1px solid #ccc; }
        #form-dados input, #form-dados select { padding: 12px; border: 1px solid #ccc; border-radius: 5px; font-family: inherit; font-size: 1rem; }

        .btn-checkout { background: var(--p-green); color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1rem; }
        .btn-whatsapp { background: #25d366; color: white; border: none; padding: 15px; font-weight: bold; cursor: pointer; width: 100%; display: none; font-size: 1rem; }
    </style>
</head>
<body>

<header>
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhQuJ4QfA-MRI3zoMZ369g2bR010Oo5zbObK9ESGcNWq2TMO197DYMjXXdICjeYi4l_8DwNCuPzpso6-M_6ED22uWkLtzU7sId9nj6KzfnvY2-oHXpKXypBYkCL4BU3P17UXbIvj_vDu1d57d5j82KSv7zv7mDdKJpncS18bn4KpKhcGjjwHEse2-CgWzQ/s320/logo2.png" class="logo-img">
    <div class="header-info">
        <h1>Pão do Ciso</h1>
        <p>Nanopadaria artesanal</p>
        <div class="contact-links">
            <a href="https://www.instagram.com/paodociso" target="_blank" class="contact-link"><i class="fab fa-instagram"></i> @paodociso</a>
            <a href="https://wa.me/5511982391781" class="contact-link"><i class="fab fa-whatsapp"></i> +55 11 98239-1781</a>
        </div>
    </div>
</header>

<div class="main-scroll">
    <div class="container" id="render-cli"></div>
</div>

<div id="cesta-rodape">
    <div class="cesta-lista" id="itens-cesta"></div>
    <div id="form-dados">
        <input type="text" id="nome" placeholder="Seu Nome">
        <input type="tel" id="tel" placeholder="Seu Telefone (DDD + Número)" maxlength="11">
        <select id="opcao" onchange="document.getElementById('end').style.display = this.value=='entrega'?'block':'none'">
            <option value="retirada">Vou retirar</option>
            <option value="entrega">Entrega</option>
        </select>
        <input type="text" id="end" placeholder="Endereço (Rua, nº, compl, ponto ref.)" style="display:none">
    </div>
    <div class="barra-total">
        <span>TOTAL:</span>
        <span id="valor-total">R$ 0,00</span>
    </div>
    <button id="btn-finalizar-cesta" class="btn-checkout" onclick="exibirForm()">FINALIZAR COMPRA</button>
    <button id="btn-enviar-wa" class="btn-whatsapp" onclick="processarFinalizacao()">ENVIAR PELO WHATSAPP</button>
</div>

<script src="cardapio.js"></script>
<script>
let carrinho = [];
let totalGeral = 0;
const CONST_URL_PLANILHA = "https://script.google.com/macros/s/AKfycbwgn3RRmPoIgpkPnNrOoQwX8nUovXdCvIn0nVJLMosCsQJYFjA8OQFLvlVHMq23qKs2rw/exec";

const rd = (db) => {
    const opsGerais = db.opcionaisGerais.map(o => ({ n: o[0].trim(), p: parseFloat(o[1]) }));
    const opsPanini = db.opcionaisPanini.map(o => ({ n: o[0].trim(), p: parseFloat(o[1]) }));
    document.getElementById('render-cli').innerHTML = db.secoes.map((s, si) => `
        <button class="collapsible" onclick="toggleColl(this)">${s.nome.toUpperCase()} <span>+</span></button>
        <div class="collapsible-content">
            ${s.itens.map((i, ii) => {
                const id = `it-${si}-${ii}`;
                const basePreco = parseFloat(i[1]);
                const f = s.tipoOpcional === "panini" ? opsPanini : opsGerais;
                const iOps = (i[3] || []).map(n => f.find(x => x.n.toLowerCase() === n.trim().toLowerCase())).filter(Boolean);
                
                return `<div class="card" id="card-${id}">
                    <div class="prod-header">
                        <img src="${i[2]}" class="img-thumb">
                        <div class="prod-info">
                            <b>${i[0]}</b>
                            <div style="font-size: 0.85rem; color: #666; margin: 4px 0; line-height: 1.2;">${i[4]}</div>
                            <small>R$ ${basePreco.toFixed(2)}</small>
                        </div>
                    </div>
                    
                    <div class="segment-qty">
                        <div class="qty-row">
                            <span style="font-weight: bold; color: var(--p-green);">QUANTIDADE DO ITEM</span>
                            <div class="qty-box">
                                <button class="btn-q" onclick="mudar(this,-1,'${id}',${basePreco})">-</button>
                                <input type="text" value="0" readonly class="qty-val main-qty">
                                <button class="btn-q" onclick="mudar(this,1,'${id}',${basePreco})">+</button>
                            </div>
                        </div>
                    </div>

                    ${iOps.length > 0 ? `
                    <div class="segment-optional">
                        <span class="optional-title">Itens Opcionais</span>
                        ${iOps.map(o => `
                        <div class="qty-row">
                            <span>${o.n} (+${o.p.toFixed(2)})</span>
                            <div class="qty-box">
                                <button class="btn-q" onclick="mudar(this,-1,'${id}',${basePreco})">-</button>
                                <input type="text" value="0" readonly class="qty-val op-qty" data-n="${o.n}" data-p="${o.p}">
                                <button class="btn-q" onclick="mudar(this,1,'${id}',${basePreco})">+</button>
                            </div>
                        </div>`).join('')}
                    </div>` : ''}

                    <div class="card-footer">
                        <div class="subtotal-item" id="subtotal-${id}">Subtotal: R$ 0,00</div>
                        <button class="btn-add" onclick="add('${i[0]}', ${basePreco}, '${id}')">Adicionar à Cesta</button>
                    </div>
                </div>`;
            }).join('')}
        </div>`).join('');
};

function toggleColl(btn) { const c = btn.nextElementSibling; c.style.display = c.style.display === 'block' ? 'none' : 'block'; btn.querySelector('span').innerText = c.style.display === 'block' ? '-' : '+'; }

function mudar(btn, d, id, basePreco) {
    const input = btn.parentNode.querySelector('input');
    input.value = Math.max(0, parseInt(input.value) + d);
    atualizarSubtotalCard(id, basePreco);
}

function atualizarSubtotalCard(id, basePreco) {
    const card = document.getElementById(`card-${id}`);
    const qPrincipal = parseInt(card.querySelector('.main-qty').value);
    const ops = card.querySelectorAll('.op-qty');
    let somaOps = 0;
    ops.forEach(o => { somaOps += (parseInt(o.value) * parseFloat(o.dataset.p)); });
    const subtotal = qPrincipal * (basePreco + somaOps);
    document.getElementById(`subtotal-${id}`).innerText = `Subtotal: R$ ${subtotal.toFixed(2)}`;
}

function add(nome, preco, id) {
    const card = document.getElementById(`card-${id}`);
    const qPrincipal = parseInt(card.querySelector('.main-qty').value);
    if (qPrincipal <= 0) { alert("Selecione a quantidade do item!"); return; }

    const inps = card.querySelectorAll('.op-qty');
    let extras = []; 
    let precoComOps = preco;
    inps.forEach(inp => { 
        const q = parseInt(inp.value); 
        if(q > 0) { 
            const p = parseFloat(inp.dataset.p); 
            extras.push({ n: inp.dataset.n, q: q }); 
            precoComOps += (p * q);
            inp.value = 0; 
        } 
    });

    const subtotalFinal = qPrincipal * precoComOps;
    carrinho.push({ nome: `${qPrincipal}x ${nome}`, subtotal: subtotalFinal, extras });
    totalGeral += subtotalFinal;
    
    card.querySelector('.main-qty').value = 0;
    card.querySelectorAll('.op-qty').forEach(o => o.value = 0);
    document.getElementById(`subtotal-${id}`).innerText = `Subtotal: R$ 0,00`;
    atualizarCesta();
}

function atualizarCesta() {
    const r = document.getElementById('cesta-rodape');
    const l = document.getElementById('itens-cesta');
    const v = document.getElementById('valor-total');
    
    if(carrinho.length > 0) {
        r.style.display = 'flex';
    } else {
        r.style.display = 'none';
    }

    v.innerText = `R$ ${totalGeral.toFixed(2)}`;
    l.innerHTML = carrinho.map((i, idx) => `
        <div class="item-cesta">
            <div class="item-info">
                <b>${i.nome}</b> (R$ ${i.subtotal.toFixed(2)})${i.extras.length ? `<br><small>${i.extras.map(e => e.q+'x '+e.n).join(', ')}</small>` : ''}
            </div>
            <button class="btn-remove" onclick="removerItem(${idx})">REMOVER</button>
        </div>`).join('');
    l.scrollTop = l.scrollHeight;
}

function removerItem(index) {
    totalGeral -= carrinho[index].subtotal;
    carrinho.splice(index, 1);
    atualizarCesta();
}

function exibirForm() {
    document.getElementById('form-dados').style.display = 'flex';
    document.getElementById('btn-finalizar-cesta').style.display = 'none';
    document.getElementById('btn-enviar-wa').style.display = 'block';
}

async function processarFinalizacao() {
    const nome = document.getElementById('nome').value.trim();
    const tel = document.getElementById('tel').value.trim().replace(/\D/g, '');
    const opcao = document.getElementById('opcao').value;
    const end = document.getElementById('end').value.trim();

    if(!nome || tel.length < 10) { alert("Preencha nome e telefone corretamente."); return; }
    if(opcao === 'entrega' && !end) { alert("Informe o endereço de entrega."); return; }

    const agora = new Date();
    const dataHora = agora.toLocaleString('pt-BR');
    const itensTexto = carrinho.map(it => `${it.nome} [${it.extras.map(e => e.q+'x '+e.n).join(', ')}]`).join(' | ');

    const payload = { dataHora, nome, telefone: tel, tipoEntrega: opcao, endereco: end || "N/A", itens: itensTexto, total: totalGeral.toFixed(2) };
    const btn = document.getElementById('btn-enviar-wa');
    btn.innerText = "SALVANDO..."; btn.disabled = true;

    try { await fetch(CONST_URL_PLANILHA, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); } catch (e) {}

    let msg = `*PEDIDO PÃO DO CISO*\n📅 ${dataHora}\n\n*Cliente:* ${nome}\n*Opção:* ${opcao}\n${opcao=='entrega'?'*End:* '+end+'\n':''}\n*ITENS:*\n`;
    carrinho.forEach(it => {
        msg += `• ${it.nome}\n`;
        it.extras.forEach(ex => msg += `  + ${ex.q}x ${ex.n}\n`);
    });
    msg += `\n*TOTAL: R$ ${totalGeral.toFixed(2)}*`;

    window.open(`https://wa.me/5511982391781?text=${encodeURIComponent(msg)}`, '_blank');
    btn.innerText = "ENVIAR PELO WHATSAPP"; btn.disabled = false;
}

window.onload = () => rd(dadosIniciais);
</script>
</body>
