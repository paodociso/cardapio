        .img-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; }
        
        .opc-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-top: 1px solid #f0f0f0; }
        
        /* CONTADORES CENTRALIZADOS */
        .qty-box { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            background: #fff; 
            border-radius: 8px; 
            border: 2px solid var(--p-green); 
            height: 40px; 
            width: 120px; 
            overflow: hidden; 
        }
        .btn-q { 
            background: #fff; color: var(--p-green); border: none; width: 40px; height: 100%;
            font-weight: bold; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
            line-height: 1;
        }
        .btn-q:first-child { border-right: 1px solid var(--p-green); }
        .btn-q:last-child { border-left: 1px solid var(--p-green); }

        .qty-val { 
            width: 40px; height: 100%; text-align: center; font-weight: 900; border: none; 
            font-size: 1.1rem; color: #000; background: #fff; display: flex; align-items: center; justify-content: center;
            pointer-events: none; appearance: none; -moz-appearance: textfield; margin: 0; padding: 0;
        }

        .input-group { background: var(--w); padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #d7ccc8; }
        input { width: 100%; padding: 12px; margin: 5px 0; border: 1px solid #ccc; border-radius: 6px; }
        
        .footer-cart { position:fixed; bottom:0; width:100%; background:white; padding:15px; border-top: 4px solid var(--p-green); z-index: 100; box-shadow: 0 -4px 10px rgba(0,0,0,0.1); }
        .btn { background: var(--a-brown); color: var(--w); border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        
        #cesta { background: #fffde7; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px dashed var(--a-brown); max-height: 120px; overflow-y: auto; display: none; font-size: 0.9rem; }
        .view { display: none; } .active { display: block; }
    </style>
</head>
