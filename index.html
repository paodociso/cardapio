<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pão do Ciso - V21.0</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --banner: #2e2610; --p-green: #2d3a27; --a-brown: #7d4f39; 
            --bg: #fdf5e6; --nav: #dccbb0; --text: #3e2723; --w: #fff; 
            --red: #b22222; --highlight: #f9f0e0; --grey: #e0e0e0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; display: flex; flex-direction: column; background: var(--bg); font-family: 'Calibri', sans-serif; color: var(--text); }

        header { background: var(--banner); color: #fdf5e6; padding: 15px 20px; border-bottom: 4px solid var(--a-brown); display: flex; align-items: center; justify-content: center; gap: 15px; flex-shrink: 0; }
        .logo-img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--a-brown); object-fit: cover; background: white; flex-shrink: 0; }
        .header-info { display: flex; flex-direction: column; justify-content: center; }
        header h1 { font-size: 1.4rem; margin: 0; line-height: 1.2; }
        .sub-link { color: #fdf5e6; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 6px; margin-top: 3px; }

        /* BANNER DE FORNADA V21.0 - CENTRALIZADO COM BORDAS LATERAIS */
        .banner-fornada {
            background: linear-gradient(135deg, var(--nav) 0%, #eaddca 100%);
            margin: 10px 15px 5px 15px;
            padding: 12px;
            border-radius: 12px;
            /* Detalhe colorido análogo à esquerda e à direita */
            border-left: 5px solid var(--a-brown);
            border-right: 5px solid var(--a-brown);
            text-align: center;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .info-fornada h2 { 
            font-size: 0.95rem; 
            text-transform: uppercase; 
            margin: 0; 
            letter-spacing: 0.5px; 
            color: var(--text);
            font-weight: 900;
        }
        .info-fornada p { 
            font-size: 0.85rem; 
            color: var(--a-brown); 
            margin-top: 2px;
            font-weight: bold;
        }

        .main-scroll { flex: 1; overflow-y: auto; padding: 5px 15px 15px 15px; }
        .container { max-width: 600px; margin: auto; }

        .collapsible { background: var(--nav); color: var(--text); cursor: pointer; padding: 12px; width: 100%; border: none; text-align: left; font-weight: bold; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; }
        .collapsible-content { display: none; }

        .card { background: var(--w); border-radius: 12px; padding: 15px; margin: 15px 0; border: 1px solid #eaddca; }
        .prod-header { display: flex; gap: 12px; margin-bottom: 12px; position: relative; }
        .img-thumb { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #ddd; cursor: zoom-in; transition: transform 0.2s; }
        .img-thumb:hover { transform: scale(1.05); }
        
        .prod-info { flex: 1; padding-right: 95px; } 
        .prod-info b { display: block; font-size: 1rem; margin-bottom: 4px; }
        .prod-info p { font-size: 0.85rem; line-height: 1.2; }
        
        .preco-topo { position: absolute; top: 0; right: 0; font-weight: 900; color: var(--text); font-size: 1.4rem; text-align: right; }
        .controles-topo { position: absolute; top: 32px; right: 0; display: flex; flex-direction: column; align-items: flex-end; }

        .frame-opcionais { border: 1px solid #eaddca; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
        .header-opcionais { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .titulo-frame { font-size: 0.75rem; font-weight: 900; color: #000; text-transform: uppercase; letter-spacing: 0.5px; }
        .divisor-opcional { border-top: 1px solid #eaddca; margin: 8px 0; }
        .lista-opcionais-interna { display: none; }

        .linha-controle { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        
        .qty-box { display: flex; align-items: center; border: 1.5px solid var(--p-green); border-radius: 4px; height: 28px; background: white; overflow: hidden; width: 90px; flex-shrink: 0; }
        .btn-q { background: var(--p-green); border: none; width: 28px; height: 100%; color: white; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; }
        .qty-val { width: 34px; border: none; text-align: center; font-weight: bold; font-size: 0.95rem; color: var(--text); }

        .subtotal-item { text-align: right; font-weight: bold; color: var(--p-green); margin: 10px 0; padding-top: 8px; border-top: 1px solid #eee; }
        
        .btn-add { 
            background: var(--p-green); color: white; border: none; padding: 14px; border-radius: 50px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase;
            box-shadow: 0 4px 10px rgba(45, 58, 39, 0.2); transition: transform 0.2s, box-shadow 0.2s; letter-spacing: 0.5px;
        }
        .btn-add:active { transform: scale(0.98); }
        
        .area-botao-prosseguir { padding: 12px 15px 15px 15px; }
        .btn-prosseguir { 
            background: var(--p-green); color: white; border: none; padding: 16px; border-radius: 50px; font-weight: 900; cursor: pointer; width: 100%; text-transform: uppercase;
            display: flex; align-items: center; justify-content: center; gap: 12px; box-shadow: 0 4px 15px rgba(45, 58, 39, 0.4); letter-spacing: 1px;
        }

        .btn-voltar { background: var(--grey); color: #333; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; }

        #cesta-rodape { background: var(--nav); border-top: 3px solid var(--a-brown); display: none; flex-direction: column; flex-shrink: 0; }
        .barra-total { background: var(--a-brown); color: white; padding: 10px 15px; display: flex; justify-content: space-between; font-weight: bold; }
        .cesta-scroll { display: flex; flex-direction: column; max-height: 140px; overflow-y: auto; padding: 10px; gap: 8px; }
        .cesta-item-linha { background: white; padding: 10px; border-radius: 6px; border: 1px solid #c4b49c; display: flex; justify-content: space-between; align-items: center; }
        .btn-remover-vermelho { background: var(--red); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.75rem; text-transform: uppercase; }

        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 999; }
        .modal-pedido { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: var(--w); border-radius: 12px; width: 90%; max-width: 480px; z-index: 1000; padding: 20px; max-height: 85vh; overflow-y: auto; }

        #modalImg { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1001; }
        #modalImg img { width: 75vw; height: 75vw; max-width: 450px; object-fit: cover; border-radius: 12px; border: 5px solid var(--w); }

        .opcao-pagamento { border: 2px solid #ddd; padding: 15px; border-radius: 8px; margin-top: 10px; cursor: pointer; text-align: center; font-weight: bold; position: relative; background: white; }
        .opcao-pagamento.selecionada { border-color: var(--p-green); background: #f0f7f0; }
        .selo-rec { position: absolute; top: -10px; right: 10px; background: var(--p-green); color: white; font-size: 0.6rem; padding: 2px 6px; border-radius: 4px; }

        .pix-info-frame { display: none; margin-top: 10px; padding: 15px; background: #fff; border: 1px dashed var(--p-green); border-radius: 8px; text-align: center; }
        .qr-container { width: 140px; height: 140px; margin: 10px auto; border: 1px solid #ddd; padding: 5px; }
        .qr-container img { width: 100%; height: 100%; object-fit: contain; }
        .btn-copiar-pix { background: #f9f0e0; border: 1px solid var(--nav); padding: 10px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 10px; margin: 10px 0; width: 100%; }

        input, select { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 6px; font-family: inherit; }
        .btn-whatsapp { background: #25d366; color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; }
        .btn-novo-pedido { background: var(--a-brown); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; text-transform: uppercase; margin-top: 10px; }
    </style>
</head>
<body>

<header>
    <img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhQuJ4QfA-MRI3zoMZ369g2bR010Oo5zbObK9ESGcNWq2TMO197DYMjXXdICjeYi4l_8DwNCuPzpso6-M_6ED22uWkLtzU7sId9nj6KzfnvY2-oHXpKXypBYkCL4BU3P17UXbIvj_vDu1d57d5j82KSv7zv7mDdKJpncS18bn4KpKhcGjjwHEse2-CgWzQ/s320/logo2.png" class="logo-img">
    <div class="header-info">
        <h1>Pão do Ciso</h1>
        <a href="https://www.instagram.com/paodociso" target="_blank" class="sub-link"><i class="fab fa-instagram"></i> @paodociso</a>
        <a href="https://wa.me/5511982391781" class="sub-link"><i class="fab fa-whatsapp"></i> +55 11 98239-1781</a>
    </div>
</header>

<div class="banner-fornada">
    <div class="info-fornada">
        <h2 id="txt-data-fornada">PRÓXIMA FORNADA: --/--</h2>
        <p id="txt-limite-pedido">Pedidos até --/--</p>
    </div>
</div>

<div class="main-scroll"><div class="container" id="render-cli"></div></div>

<div id="cesta-rodape">
    <div class="barra-total"><span>TOTAL:</span><span id="total-txt">R$ 0,00</span></div>
    <div class="cesta-scroll" id="cesta-lista"></div>
    <div class="area-botao-prosseguir">
        <button class="btn-prosseguir" onclick="abrirRevisao()">
            <span>CONFERIR PEDIDO</span>
            <i class="fas fa-chevron-right"></i>
        </button>
    </div>
</div>

<div id="modalOverlay" class="modal-overlay" onclick="fecharModais()"></div>
<div id="modalImg" onclick="fecharModais()"><img id="imgExpandida" src=""></div>

<div id="modalRevisao" class="modal-pedido">
    <h3 style="margin-bottom:15px; border-bottom: 2px solid var(--nav); padding-bottom: 10px;">Minha Cesta</h3>
    <div id="lista-revisao-completa"></div>
    <div style="font-weight:bold; margin-top:15px; text-align:right;" id="revisao-total-txt"></div>
    <button class="btn-add" style="margin-top:20px;" onclick="abrirDados()">PROSSEGUIR PARA O PAGAMENTO</button>
    <button class="btn-voltar" onclick="fecharModais()">VOLTAR AO CARDÁPIO</button>
</div>

<div id="modalDados" class="modal-pedido">
    <div id="etapa-dados">
        <h3 style="margin-bottom:10px">Seus Dados</h3>
        <input type="text" id="nomeCli" placeholder="Nome Completo *">
        <input type="tel" id="telCli" placeholder="WhatsApp (Somente Números) *" maxlength="11">
        <select id="tipoEntrega" onchange="toggleEndereco()">
            <option value="Retirada">Vou retirar no local</option>
            <option value="Entrega">Entrega em domicílio</option>
        </select>
        <div id="campo-endereco" style="display:none"><input type="text" id="endCli" placeholder="Endereço Completo *"></div>
        <button class="btn-add" style="margin-top:15px;" onclick="irParaPagamento()">ESCOLHER PAGAMENTO</button>
        <button class="btn-voltar" onclick="voltarParaRevisao()">VOLTAR PARA CESTA</button>
    </div>

    <div id="etapa-pagamento" style="display:none">
        <h3 style="margin-bottom:10px">Forma de Pagamento</h3>
        <div class="opcao-pagamento" onclick="selPgto('Pix', this)">
            PIX <span class="selo-rec">RECOMENDADO</span>
            <div id="pix-detalhes-frame" class="pix-info-frame">
                <div style="background:var(--highlight); padding:8px; border-radius:4px; font-weight:900; color:var(--p-green); margin-bottom:10px;">
                    VALOR: <span id="pix-valor-txt"></span>
                </div>
                <div class="qr-container"><img src="https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEhAdMMy5OknVHvs1RNFM3tik8FXT0lwM1JmYjJmtnZJrFb46pcwkOdTMCsRA5wx3whHPeXFm_8Ql6iZCFGmoKLrQiM0lCuVDc5YFLGEwhNplENrWlYhKFGG1ONARuy8VgZR0ROpGK9MT123ng1aL69gz-rmRXGejVZqeUqDwKf81nmxOZ5RqTqJV_Lqw3g/s1000/qrcode-paodociso.png"></div>
                <div class="btn-copiar-pix" onclick="copiarChave()"><b>paodociso@gmail.com</b> <i class="far fa-copy"></i></div>
            </div>
        </div>
        <div class="opcao-pagamento" onclick="selPgto('Cartão', this)">Cartão (Débito/Crédito)</div>
        <div class="opcao-pagamento" onclick="selPgto('Dinheiro', this)">Dinheiro</div>
        <button class="btn-add" style="margin-top:20px;" onclick="finalizar()">FINALIZAR PEDIDO</button>
        <button class="btn-voltar" onclick="voltarParaDados()">VOLTAR PARA DADOS</button>
    </div>
</div>

<div id="modalSucesso" class="modal-pedido">
    <div id="status-final" style="text-align: center;">
        <i class="fas fa-check-circle" style="color: var(--a-brown); font-size: 3rem;"></i>
        <h3>Pedido Confirmado!</h3>
        <button class="btn-whatsapp" onclick="iniciarEnvioWhatsApp()">ENVIAR WHATSAPP</button>
    </div>
</div>

<script src="cardapio.js"></script>
<script>
// ==========================================================
// EDITAR DATA DA PRÓXIMA FORNADA ABAIXO 
const DATA_PROXIMA_FORNADA = "2025-01-14"; 
// ==========================================================

function atualizarBannerFornada() {
    const dataF = new Date(DATA_PROXIMA_FORNADA + "T12:00:00");
    const dataP = new Date(dataF);
    dataP.setDate(dataP.getDate() - 3);
    const formatar = (d) => d.toLocaleDateString('pt-BR', {day: '2-digit', month: '2-digit'});
    document.getElementById('txt-data-fornada').innerText = `PRÓXIMA FORNADA: ${formatar(dataF)}`;
    document.getElementById('txt-limite-pedido').innerText = `Pedidos até ${formatar(dataP)}`;
}

let carrinho = [], totalGeral = 0, pgtoSel = "";
let memory = { nome: "", tel: "", entrega: "Retirada", endereco: "" };

function render() {
    atualizarBannerFornada();
    const { secoes } = dadosIniciais;
    document.getElementById('render-cli').innerHTML = secoes.map((s, si) => {
        const chaveOpcionais = "opcionais" + s.nome;
        const bancoDeOpcionaisDaSecao = dadosIniciais[chaveOpcionais] || [];
        return `
        <button class="collapsible" onclick="toggleC(this)">${s.nome.toUpperCase()} <span>+</span></button>
        <div class="collapsible-content">
            ${s.itens.map((i, ii) => {
                const id = `it-${si}-${ii}`;
                const iOps = (i[4] || []).map(nomeOpcional => bancoDeOpcionaisDaSecao.find(x => x[0].trim() === nomeOpcional.trim())).filter(Boolean);
                return `
                <div class="card" id="card-${id}">
                    <div class="prod-header">
                        <img src="${i[3]}" class="img-thumb" onclick="ampliarImg('${i[3]}')">
                        <div class="prod-info">
                            <b>${i[0]}</b>
                            <p>${i[1]}</p>
                            <span class="preco-topo">R$ ${(+i[2]).toFixed(2)}</span>
                            <div class="controles-topo">
                                <div class="qty-box">
                                    <button class="btn-q" onclick="mudar(-1,'${id}',${i[2]})">-</button>
                                    <input type="text" value="0" readonly class="qty-val main-qty">
                                    <button class="btn-q" onclick="mudar(1,'${id}',${i[2]})">+</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    ${iOps.length ? `
                    <div class="frame-opcionais">
                        <div class="header-opcionais" onclick="toggleOps('${id}')">
                            <span class="titulo-frame">OPCIONAIS</span>
                            <span id="seta-${id}">▼</span>
                        </div>
                        <div id="lista-ops-${id}" class="lista-opcionais-interna">
                            <div class="divisor-opcional"></div>
                            ${iOps.map(o => `
                                <div class="linha-controle" style="margin-bottom:8px">
                                    <span style="font-size:0.85rem">${o[0]} (+R$ ${(+o[1]).toFixed(2)})</span>
                                    <div class="qty-box">
                                        <button class="btn-q" onclick="mudar(-1,'${id}',${i[2]})">-</button>
                                        <input type="text" value="0" readonly class="qty-val op-qty" data-n="${o[0]}" data-p="${o[1]}">
                                        <button class="btn-q" onclick="mudar(1,'${id}',${i[2]})">+</button>
                                    </div>
                                </div>`).join('')}
                        </div>
                    </div>` : ''}
                    <div class="subtotal-item" id="sub-${id}">Subtotal: R$ 0,00</div>
                    <button class="btn-add" onclick="add('${i[0]}', ${i[2]}, '${id}')">ADICIONAR</button>
                </div>`}).join('')}
        </div>`
    }).join('');
    carregarDadosSalvos();
}

function mudar(d, id, base) {
    const box = event.target.parentNode;
    const inp = box.querySelector('input');
    inp.value = Math.max(0, +inp.value + d);
    const card = document.getElementById(`card-${id}`);
    const qP = +card.querySelector('.main-qty').value;
    let tO = 0; card.querySelectorAll('.op-qty').forEach(o => tO += (+o.value * +o.dataset.p));
    let sub = qP > 0 ? qP * (base + tO) : tO;
    document.getElementById(`sub-${id}`).innerText = `Subtotal: R$ ${sub.toFixed(2)}`;
}

function add(nome, preco, id) {
    const card = document.getElementById(`card-${id}`);
    const q = +card.querySelector('.main-qty').value;
    let ex = [], pE = 0;
    card.querySelectorAll('.op-qty').forEach(o => { if(+o.value > 0){ ex.push({n: o.dataset.n, q: o.value}); pE += (+o.value * +o.dataset.p); }});
    if (q <= 0 && pE <= 0) return alert("Selecione a quantidade!");
    const sub = q > 0 ? q * (preco + pE) : pE;
    carrinho.push({ nome, q, sub, ex });
    totalGeral += sub;
    atualizarCesta();
    card.querySelector('.main-qty').value = 0;
    card.querySelectorAll('.op-qty').forEach(o => o.value = 0);
    document.getElementById(`sub-${id}`).innerText = `Subtotal: R$ 0,00`;
}

function atualizarCesta() {
    document.getElementById('cesta-rodape').style.display = carrinho.length ? 'flex' : 'none';
    document.getElementById('total-txt').innerText = `R$ ${totalGeral.toFixed(2)}`;
    document.getElementById('cesta-lista').innerHTML = carrinho.map((i, idx) => `<div class="cesta-item-linha"><div><b>${i.q > 0 ? i.q + 'x ' : ''}${i.nome}</b> - R$ ${i.sub.toFixed(2)}</div><button class="btn-remover-vermelho" onclick="remover(${idx})">Remover</button></div>`).join('');
}

function remover(idx) { totalGeral -= carrinho[idx].sub; carrinho.splice(idx, 1); atualizarCesta(); if(document.getElementById('modalRevisao').style.display === 'block') abrirRevisao(); if(!carrinho.length) fecharModais(); }
function abrirRevisao() { document.getElementById('modalOverlay').style.display = 'block'; document.getElementById('modalRevisao').style.display = 'block'; document.getElementById('revisao-total-txt').innerText = `TOTAL: R$ ${totalGeral.toFixed(2)}`; document.getElementById('lista-revisao-completa').innerHTML = carrinho.map((i, idx) => `<div class="cesta-item-linha" style="margin-bottom:8px"><div><b>${i.q > 0 ? i.q + 'x ' : ''}${i.nome}</b> - R$ ${i.sub.toFixed(2)}</div><button class="btn-remover-vermelho" onclick="remover(${idx})">Remover</button></div>`).join(''); }
function abrirDados() { document.getElementById('modalRevisao').style.display = 'none'; document.getElementById('modalDados').style.display = 'block'; }
function voltarParaRevisao() { document.getElementById('modalDados').style.display = 'none'; document.getElementById('modalRevisao').style.display = 'block'; }
function voltarParaDados() { document.getElementById('etapa-pagamento').style.display = 'none'; document.getElementById('etapa-dados').style.display = 'block'; }
function toggleEndereco() { document.getElementById('campo-endereco').style.display = document.getElementById('tipoEntrega').value === 'Entrega' ? 'block' : 'none'; }
function fecharModais() { document.querySelectorAll('.modal-pedido, .modal-overlay, #modalImg').forEach(m => m.style.display = 'none'); }
function ampliarImg(src) { document.getElementById('imgExpandida').src = src; document.getElementById('modalOverlay').style.display = 'block'; document.getElementById('modalImg').style.display = 'block'; }
function toggleC(b) { const c = b.nextElementSibling; c.style.display = c.style.display === 'block' ? 'none' : 'block'; }
function toggleOps(id) { const l = document.getElementById(`lista-ops-${id}`); l.style.display = l.style.display === 'block' ? 'none' : 'block'; }
function carregarDadosSalvos() { const salvo = localStorage.getItem('paoDoCisoDados'); if(salvo) { const d = JSON.parse(salvo); document.getElementById('nomeCli').value = d.nome || ""; document.getElementById('telCli').value = d.tel || ""; document.getElementById('tipoEntrega').value = d.entrega || "Retirada"; document.getElementById('endCli').value = d.endereco || ""; toggleEndereco(); } }

function irParaPagamento() {
    const n = document.getElementById('nomeCli').value.trim(), tRaw = document.getElementById('telCli').value.trim(), t = tRaw.replace(/\D/g, ''), e = document.getElementById('tipoEntrega').value, end = document.getElementById('endCli').value.trim();
    if(!n || t.length < 10) return alert("Preencha os dados corretamente!");
    memory = { nome: n, tel: t, entrega: e, endereco: end };
    localStorage.setItem('paoDoCisoDados', JSON.stringify(memory));
    document.getElementById('pix-valor-txt').innerText = `R$ ${totalGeral.toFixed(2)}`;
    document.getElementById('etapa-dados').style.display = 'none'; document.getElementById('etapa-pagamento').style.display = 'block';
}

function selPgto(t, el) { pgtoSel = t; document.querySelectorAll('.opcao-pagamento').forEach(o => o.classList.remove('selecionada')); el.classList.add('selecionada'); document.getElementById('pix-detalhes-frame').style.display = t === 'Pix' ? 'block' : 'none'; }

function finalizar() {
    if(!pgtoSel) return alert("Selecione o pagamento!");
    salvarNaPlanilha();
    document.getElementById('modalDados').style.display = 'none';
    document.getElementById('modalSucesso').style.display = 'block';
}

function salvarNaPlanilha() {
    const url = "https://script.google.com/macros/s/AKfycbxdCvZQgulHwUnKcyVSueuS_0doo_Ggh7xynYsuyXqolGlfJPruUHDtgFSNpeYnZZwlZw/exec";
    const itens = carrinho.map(i => `${i.q}x ${i.nome}`).join(" | ");
    const dados = { nome: memory.nome, telefone: memory.tel, tipoEntrega: memory.entrega, endereco: memory.endereco || "N/A", itens: itens, total: totalGeral.toFixed(2), pagamento: pgtoSel };
    fetch(url, { method: 'POST', mode: 'no-cors', body: JSON.stringify(dados) });
}

function iniciarEnvioWhatsApp() {
    let msg = `*PÃO DO CISO*\nCliente: ${memory.nome}\nPagamento: ${pgtoSel}\nTotal: R$ ${totalGeral.toFixed(2)}\n\n*ITENS:*\n`;
    carrinho.forEach(i => msg += `- ${i.q}x ${i.nome}\n`);
    window.open(`https://wa.me/5511982391781?text=${encodeURIComponent(msg)}`);
}

function copiarChave() { navigator.clipboard.writeText("paodociso@gmail.com").then(() => alert("Chave PIX copiada!")); }
window.onload = render;
