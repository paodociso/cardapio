<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gestão Pão do Ciso v9.1</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        :root { --p-green: #2d3a27; --a-brown: #7d4f39; --bg: #f5f5f5; --white: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; color: #333; margin: 0; }
        .container { max-width: 1100px; margin: 0 auto; }
        header { background: var(--p-green); color: white; padding: 20px; border-radius: 12px; text-align: center; margin-bottom: 20px; }
        
        .nav-abas { display: flex; gap: 5px; margin-bottom: 20px; border-bottom: 2px solid #ddd; }
        .aba { padding: 12px 25px; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: bold; background: #ddd; color: #666; }
        .aba.ativa { background: var(--a-brown); color: white; }
        .aba-content { display: none; }
        .aba-content.ativa { display: block; }

        button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; background: var(--a-brown); color: white; font-size: 10px; text-transform: uppercase; }
        .btn-verde { background: #28a745; }
        .btn-vermelho { background: #dc3545; }
        .btn-azul { background: #007bff; }
        .btn-cinza { background: #6c757d; }

        /* SEÇÃO */
        .secao-container { background: white; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); border: 1px solid #ddd; }
        .secao-header { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; background: #f8f9fa; cursor: pointer; }
        .drag-handle-secao { cursor: grab; margin-right: 15px; color: #888; font-size: 20px; padding: 5px; }
        .secao-titulo { flex: 1; font-weight: bold; color: var(--p-green); font-size: 15px; }
        .secao-corpo { display: block; min-height: 60px; padding: 0 10px; border-top: 1px solid #eee; background: #fff; }
        .secao-corpo.fechado { display: none; }

        /* ITEM */
        .item-detalhado { display: flex; gap: 15px; padding: 15px; border-bottom: 1px solid #eee; align-items: center; background: white; cursor: grab; }
        .img-preview { width: 70px; height: 70px; object-fit: cover; border-radius: 8px; flex-shrink: 0; background: #eee; }
        .item-info { flex: 1; }
        .item-info strong { font-size: 15px; color: var(--p-green); display: block; }
        .item-info p { margin: 3px 0; font-size: 12px; color: #666; }
        .acoes-item { display: flex; gap: 5px; }

        /* MODAIS */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-card { background: white; width: 90%; max-width: 550px; padding: 30px; border-radius: 15px; }
        input, textarea, select { width: 100%; padding: 12px; margin: 8px 0 18px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        .opcionais-grid { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px; border: 1px solid #eee; border-radius: 8px; max-height: 150px; overflow-y: auto; }
        .opc-tag { padding: 6px 12px; border-radius: 20px; background: #eee; font-size: 11px; cursor: pointer; border: 1px solid #ccc; }
        .opc-tag.active { background: var(--p-green); color: white; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Painel de Controle v9.1</h1>
        <p>Gestão Pão do Ciso: Liberdade de Movimento</p>
    </header>

    <div class="nav-abas">
        <div id="aba-itens" class="aba ativa" onclick="mudarAba('itens')">PRODUTOS</div>
        <div id="aba-secoes" class="aba" onclick="mudarAba('secoes')">SEÇÕES</div>
        <div id="aba-opcionais" class="aba" onclick="mudarAba('opcionais')">OPCIONAIS</div>
        <div style="flex:1; text-align: right; padding-top: 5px;">
            <button onclick="baixar()" class="btn-verde">SALVAR CARDAPIO.JS</button>
        </div>
    </div>

    <div id="view-itens" class="aba-content ativa">
        <div style="display: flex; gap: 10px; margin-bottom: 20px; align-items: center;">
            <input type="text" id="busca-produtos" placeholder="Localizar produto..." onkeyup="filtrarProdutos()" style="margin:0; flex:1;">
            <button onclick="alternarTodas(true)" class="btn-cinza">↕ Abrir Todas</button>
            <button onclick="alternarTodas(false)" class="btn-cinza">↕ Colapsar Todas</button>
        </div>
        <div id="render-lista-secoes"></div>
    </div>

    <div id="view-secoes" class="aba-content">
        <div style="background:#fff; padding:25px; border-radius:12px; border:1px solid #ddd;">
            <h3>Categorias</h3>
            <div style="display:flex; gap:10px;"><input type="text" id="nova-secao-nome" placeholder="Nova Seção..."><button onclick="adicionarSecao()" class="btn-verde">Adicionar</button></div>
            <div id="render-secoes-gestao" style="margin-top:20px;"></div>
        </div>
    </div>

    <div id="view-opcionais" class="aba-content">
        <div style="background:#fff; padding:25px; border-radius:12px; border:1px solid #ddd;">
            <h3>Opcionais</h3>
            <div style="display:grid; grid-template-columns: 2fr 1fr 1.5fr; gap:10px;">
                <input type="text" id="opc-nome" placeholder="Nome"><input type="number" id="opc-preco" placeholder="Preço"><select id="opc-destino"></select>
            </div>
            <button onclick="adicionarOpcional()" class="btn-verde">Salvar Opcional</button>
            <div id="render-opcionais-lista" style="margin-top:20px;"></div>
        </div>
    </div>
</div>

<div id="modal-produto" class="modal-overlay">
    <div class="modal-card">
        <h2>Editar Produto</h2>
        <form id="form-item">
            <input type="hidden" id="edit-s-idx"> <input type="hidden" id="edit-i-idx">
            <input type="text" id="f-nome" placeholder="Nome" required>
            <textarea id="f-desc" rows="3" placeholder="Descrição"></textarea>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <input type="number" id="f-preco" step="0.01" placeholder="Preço R$" required>
                <select id="f-secao" onchange="atualizarOpcionaisForm()"></select>
            </div>
            <div style="display:flex; gap:10px;"><input type="url" id="f-img" placeholder="Link da Imagem"><button type="button" onclick="buscarNoGoogle()" class="btn-azul">🔍</button></div>
            <div id="f-opc-container" class="opcionais-grid" style="margin-top:15px;"></div>
            <div style="margin-top:25px; display:flex; gap:10px; justify-content:flex-end;"><button type="button" class="btn-cinza" onclick="fecharModal()">Sair</button><button type="submit" class="btn-verde">Salvar</button></div>
        </form>
    </div>
</div>

<div id="modal-mover" class="modal-overlay">
    <div class="modal-card" style="max-width: 400px;">
        <h3>Mover Produto</h3>
        <p id="mover-nome-item" style="font-weight:bold;"></p>
        <input type="hidden" id="mover-s-origem">
        <input type="hidden" id="mover-i-origem">
        <select id="mover-secao-destino"></select>
        <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn-cinza" onclick="fecharModalMover()">Cancelar</button>
            <button class="btn-verde" onclick="confirmarMover()">Confirmar</button>
        </div>
    </div>
</div>

<script src="cardapio.js"></script>
<script>
    let db = typeof dadosIniciais !== 'undefined' ? dadosIniciais : { secoes: [], opcionaisGerais: [] };

    function mudarAba(id) {
        document.querySelectorAll('.aba-content').forEach(c => c.classList.remove('ativa'));
        document.querySelectorAll('.aba').forEach(a => a.classList.remove('ativa'));
        document.getElementById('view-' + id).classList.add('ativa');
        document.getElementById('aba-' + id).classList.add('ativa');
        if(id === 'itens') renderizarTudo();
        if(id === 'secoes') renderizarSecoesGestao();
        if(id === 'opcionais') { atualizarDropdownDestino(); renderizarOpcionaisLista(); }
    }

    function renderizarTudo() {
        const container = document.getElementById('render-lista-secoes');
        const selForm = document.getElementById('f-secao');
        const selMover = document.getElementById('mover-secao-destino');
        
        // Salva quais seções estavam fechadas para manter o estado
        const estadosFechados = Array.from(document.querySelectorAll('.secao-corpo.fechado')).map(el => el.id);

        container.innerHTML = ""; selForm.innerHTML = ""; selMover.innerHTML = "";
        
        db.secoes.forEach((sec, sIdx) => {
            const opt = `<option value="${sec.nome}">${sec.nome}</option>`;
            selForm.innerHTML += opt;
            selMover.innerHTML += opt;
            
            const isFechada = estadosFechados.includes(`corpo-${sIdx}`);
            const div = document.createElement('div');
            div.className = 'secao-container';
            div.innerHTML = `
                <div class="secao-header" onclick="toggleSecao(${sIdx})">
                    <span class="drag-handle-secao" onclick="event.stopPropagation()">☰</span>
                    <span class="secao-titulo">${sec.nome.toUpperCase()} (${sec.itens.length})</span>
                    <div style="display:flex; gap:10px; align-items:center;">
                        <button class="btn-verde" onclick="event.stopPropagation(); prepararNovo('${sec.nome}')">+ PRODUTO</button>
                        <span id="seta-${sIdx}">${isFechada ? '▶' : '▼'}</span>
                    </div>
                </div>
                <div class="secao-corpo ${isFechada ? 'fechado' : ''}" id="corpo-${sIdx}" data-sidx="${sIdx}"></div>
            `;
            container.appendChild(div);

            const corpo = div.querySelector('.secao-corpo');
            sec.itens.forEach((it, iIdx) => {
                const el = document.createElement('div');
                el.className = 'item-detalhado';
                el.innerHTML = `
                    <img src="${it[3]||''}" class="img-preview" onerror="this.src='https://via.placeholder.com/70'">
                    <div class="item-info">
                        <strong>${it[0]}</strong>
                        <p>${it[1] || '---'}</p>
                        <b>R$ ${it[2]}</b>
                    </div>
                    <div class="acoes-item">
                        <button class="btn-azul" onclick="event.stopPropagation(); abrirMoverModal(${sIdx}, ${iIdx})">Mover</button>
                        <button class="btn-cinza" onclick="event.stopPropagation(); editar(${sIdx}, ${iIdx})">Editar</button>
                        <button class="btn-vermelho" onclick="event.stopPropagation(); excluir(${sIdx}, ${iIdx})">X</button>
                    </div>`;
                corpo.appendChild(el);
            });

            // Sortable para ITENS (entre seções)
            new Sortable(corpo, {
                group: 'produtos',
                animation: 150,
                onEnd: (evt) => {
                    const sDe = evt.from.dataset.sidx;
                    const sPara = evt.to.dataset.sidx;
                    const item = db.secoes[sDe].itens.splice(evt.oldIndex, 1)[0];
                    db.secoes[sPara].itens.splice(evt.newIndex, 0, item);
                    if(sDe !== sPara) renderizarTudo();
                }
            });
        });

        // Sortable para SEÇÕES
        new Sortable(container, {
            animation: 150,
            handle: '.drag-handle-secao',
            onEnd: (evt) => {
                const item = db.secoes.splice(evt.oldIndex, 1)[0];
                db.secoes.splice(evt.newIndex, 0, item);
                renderizarTudo();
            }
        });
    }

    function toggleSecao(idx) {
        const c = document.getElementById(`corpo-${idx}`), s = document.getElementById(`seta-${idx}`);
        const fechado = c.classList.toggle('fechado');
        s.innerText = fechado ? '▶' : '▼';
    }

    function alternarTodas(abrir) {
        document.querySelectorAll('.secao-corpo').forEach(c => abrir ? c.classList.remove('fechado') : c.classList.add('fechado'));
        document.querySelectorAll('[id^="seta-"]').forEach(s => s.innerText = abrir ? '▼' : '▶');
    }

    // MODAIS E EDIÇÃO
    function abrirModal() { document.getElementById('modal-produto').style.display = 'flex'; }
    function fecharModal() { document.getElementById('modal-produto').style.display = 'none'; }
    function prepararNovo(sec) { document.getElementById('form-item').reset(); document.getElementById('edit-s-idx').value = ""; document.getElementById('f-secao').value = sec; atualizarOpcionaisForm(); abrirModal(); }
    
    function editar(s, i) {
        const it = db.secoes[s].itens[i];
        document.getElementById('edit-s-idx').value = s; document.getElementById('edit-i-idx').value = i;
        document.getElementById('f-nome').value = it[0]; document.getElementById('f-desc').value = it[1];
        document.getElementById('f-preco').value = it[2]; document.getElementById('f-img').value = it[3];
        document.getElementById('f-secao').value = db.secoes[s].nome;
        renderOpcionaisBotoes(it[4]||[], db.secoes[s].nome);
        abrirModal();
    }

    document.getElementById('form-item').onsubmit = function(e) {
        e.preventDefault();
        const sOld = document.getElementById('edit-s-idx').value, iOld = document.getElementById('edit-i-idx').value, sAlvo = document.getElementById('f-secao').value;
        const opcs = Array.from(document.querySelectorAll('input[name="opc"]:checked')).map(c=>c.value);
        const novo = [document.getElementById('f-nome').value, document.getElementById('f-desc').value, document.getElementById('f-preco').value, document.getElementById('f-img').value, opcs, "ativo"];
        if(sOld !== "") db.secoes[sOld].itens.splice(iOld, 1);
        db.secoes.find(s => s.nome === sAlvo).itens.push(novo);
        fecharModal(); renderizarTudo();
    }

    // MOVER VIA SELECT
    function abrirMoverModal(s, i) {
        const it = db.secoes[s].itens[i];
        document.getElementById('mover-nome-item').innerText = it[0];
        document.getElementById('mover-s-origem').value = s;
        document.getElementById('mover-i-origem').value = i;
        document.getElementById('modal-mover').style.display = 'flex';
    }
    function fecharModalMover() { document.getElementById('modal-mover').style.display = 'none'; }
    function confirmarMover() {
        const sOri = document.getElementById('mover-s-origem').value, iOri = document.getElementById('mover-i-origem').value, sDest = document.getElementById('mover-secao-destino').value;
        const item = db.secoes[sOri].itens.splice(iOri, 1)[0];
        db.secoes.find(s => s.nome === sDest).itens.push(item);
        fecharModalMover(); renderizarTudo();
    }

    // GESTÃO DE SEÇÕES/OPCIONAIS
    function renderizarSecoesGestao() {
        document.getElementById('render-secoes-gestao').innerHTML = db.secoes.map((s, idx) => `
            <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #eee;">
                <strong>${s.nome}</strong><button class="btn-vermelho" onclick="removerSecao(${idx})">Remover</button>
            </div>`).join('') || "Vazio";
    }
    function adicionarSecao() { const n = document.getElementById('nova-secao-nome').value; if(n){ db.secoes.push({nome:n, itens:[]}); renderizarTudo(); renderizarSecoesGestao(); } }
    function removerSecao(i) { if(db.secoes[i].itens.length===0){ db.secoes.splice(i,1); renderizarSecoesGestao(); renderizarTudo(); } }
    function atualizarDropdownDestino() {
        let opt = `<option value="opcionaisGerais">Geral</option>`;
        db.secoes.forEach(s => opt += `<option value="opcionais${s.nome}">${s.nome}</option>`);
        document.getElementById('opc-destino').innerHTML = opt;
    }
    function renderizarOpcionaisLista() {
        let h = "";
        for(let k in db) { if(k.startsWith('opcionais') && db[k].length > 0) {
            h += `<h4>${k}</h4>`;
            db[k].forEach((op, i) => h += `<div style="padding:5px; border-bottom:1px solid #eee;">${op[0]} <button class="btn-vermelho" onclick="removerOpcional('${k}',${i})">X</button></div>`);
        }}
        document.getElementById('render-opcionais-lista').innerHTML = h;
    }
    function adicionarOpcional() {
        const n = document.getElementById('opc-nome').value, p = document.getElementById('opc-preco').value, a = document.getElementById('opc-destino').value;
        if(n && p){ if(!db[a])db[a]=[]; db[a].push([n, parseFloat(p).toFixed(2)]); renderizarOpcionaisLista(); }
    }
    function removerOpcional(k, i) { db[k].splice(i,1); renderizarOpcionaisLista(); }
    function atualizarOpcionaisForm() { renderOpcionaisBotoes([], document.getElementById('f-secao').value); }
    function renderOpcionaisBotoes(sel=[], secName="") {
        const cont = document.getElementById('f-opc-container'), chaveSec = "opcionais" + secName, lista = [...(db.opcionaisGerais||[]), ...(db[chaveSec]||[])];
        cont.innerHTML = lista.map(op => { const active = sel.includes(op[0]); return `<div class="opc-tag ${active?'active':''}" onclick="toggleTag(this)"><input type="checkbox" name="opc" value="${op[0]}" ${active?'checked':''}>${op[0]}</div>`; }).join('') || "Sem opcionais.";
    }
    function toggleTag(el) { const cb = el.querySelector('input'); cb.checked = !cb.checked; el.classList.toggle('active', cb.checked); }

    function excluir(s, i) { if(confirm("Excluir?")) { db.secoes[s].itens.splice(i,1); renderizarTudo(); } }
    function buscarNoGoogle() { const n = document.getElementById('f-nome').value; if(n) window.open(`https://www.google.com/search?q=${n}+foto+cardapio&tbm=isch`, '_blank'); }
    function filtrarProdutos() {
        const t = document.getElementById('busca-produtos').value.toLowerCase();
        document.querySelectorAll('.item-detalhado').forEach(el => el.style.display = el.innerText.toLowerCase().includes(t) ? 'flex' : 'none');
    }

    function baixar() {
        let out = "// cardapio.js\nconst dadosIniciais = {\n";
        for(let k in db) { if(k.startsWith('opcionais') && db[k].length > 0) out += `  "${k}": ${JSON.stringify(db[k], null, 4)},\n`; }
        out += `  "secoes": [\n`;
        db.secoes.forEach((sec, sIdx) => {
            out += `    {\n      "nome": "${sec.nome}",\n      "itens": [\n`;
            sec.itens.forEach((it, iIdx) => out += `        ${JSON.stringify(it)}${iIdx===sec.itens.length-1?'':','}\n`);
            out += `      ]\n    }${sIdx === db.secoes.length - 1 ? "" : ","}\n`;
        });
        out += `  ]\n};`;
        const blob = new Blob([out], {type: 'text/javascript'});
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = "cardapio.js"; a.click();
    }
    window.onload = () => { renderizarTudo(); renderizarSecoesGestao(); };
</script>
</body>
</html>
